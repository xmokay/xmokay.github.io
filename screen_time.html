<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Time</title>
    <style>
        body {
            margin: 0;
            padding: 48px 12px;
            font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
        }

        #display {
            border-color: grey;
            border-width: medium;
            background-color: lightblue;
            text-align: center;
            font-size: 36px;
            padding: 12px 6px;
        }

        #chooser {
            margin-top: 16px;
        }

        .btn {
            margin-top: 12px;
            padding: 10px 6px;
            text-align: center;
            font-size: 30px;
            background-color: lightgray;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>
<div id="display">😉</div>
<div id="chooser"></div>
<div id="next_btn" class="btn">我已输入，请显示下一个</div>

<script>
    'use strict';

    (function () {
        const DEBUG = false;

        // π 的小数部分，不含前导 "3."。piStart 为 1 表示第一位小数。
        const PI = "1415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679821480865132823066470938446095505822317253594081284811174502841027019385211055596446229489549303819644288109756659334461284756482337867831652712019091456485669234603486104543266482133936072602491412737245870066063155881748815209209628292540917153643678925903600113305305488204665213841469519415116094330572703657595919530921861173819326117931051185480744623799627495673518857527248912279381830119491298336733624406566430860213949463952247371907021798609437027705392171762931767523846748184676694051320005681271452635608277857713427577896091736371787214684409012249534301465495853710507922796892589235420199561121290219608640344181598136297747713099605187072113499999983729780499510597317328160963185950244594553469083026425223082533446850352619311881710100031378387528865875332083814206171776691473035982534904287554687311595628638823537875937519577818577805321712268066130019278766111959092164201989";

        // 默认难度。候选项里的 difficulty 会逐字段覆盖这里的值。
        const DEFAULT_DIFFICULTY = {
            terms: 2,                          // 算术题基础项数
            operandDigits: 2,                  // 每项位数，2 表示 10..99
            allowNegativeTerms: true,         // 允许出现减法项，渲染成 11-11 而不是 11+(-11)
            allowNegativeIntermediate: false,  // 允许从左往右累加的过程中出现负数
            adaptive: {                        // 上一题答得越快，下一题项数越多，拖长冲刷记忆的时间
                fastSeconds: 7,
                mediumSeconds: 10,
                fastBonus: 2,
                mediumBonus: 1
            },
            minClears: 1,                      // 全清最少次数（字段被删回空）
            maxClears: 1,                      // 全清最多次数；固定为 1 避免「全清当锚点」
            retreatProbability: 0.15,          // 已经敲对的真数字被浅层回撤的概率
            deepRetreatProbability: 0.25,      // 浅层回撤时删掉多位（但仍至少留 1 位）的概率
            minRetreats: 1,                    // 至少一次回撤；预定全清兼任
            separatorProbability: 1,           // 非空字段上、每位真数字之前插入噪音的概率
            churnTwoDigitProbability: 0.15,    // churn 时输入 2 位垃圾再删回的概率
            minCalcCount: 2,                   // 至少出几道算术题
            maxCalcCount: 3,                   // 算术题总数超过这个值后不再追加诱饵题
            gapCalcProbability: 0.35,          // 真数字间隙放题的概率（不再每个间隙强制一题）
            finalGapCalcCount: 1,              // 最后一位之前连出几道题
            extraCalcProbability: 0.04,        // 诱饵题概率，让出题位置与真数字脱钩
            maxOps: 18                         // 操作步数上限，回撤会让序列变长，靠它兜住
        };

        const CANDIDATES = [
            {
                name: 'iPad、大菁手机',
                piStart: 248,
                length: 4,
                difficulty: {
                    // 其余字段继承 DEFAULT_DIFFICULTY：两项加法、不出负数。
                    // 只压低自适应加成，孩子答得快时最多加到 3 项，不会出现 4 个两位数连加。
                    terms: 4, //temporary
                    allowNegativeTerms: true, //temporary
                    allowNegativeIntermediate: true, //temporary
                    adaptive: {
                        fastBonus: 1,
                        mediumBonus: 0
                    }
                }
            },
            {
                name: '大明手机',
                piStart: 244,                      // 改成你自己的偏移量
                length: 4,
                difficulty: {
                    terms: 4,                      // 四个数连加减
                    allowNegativeTerms: true,
                    allowNegativeIntermediate: true
                }
            }
        ];

        const COLORS = ["#FF0000", "#FFA500", "#FFFF00", "#008000", "#0000FF", "#4B0082", "#800080"];
        const BG_COLORS = ["#008000", "#4B0082", "#0000FF", "#FF0000", "#FFFF00", "#FFA500", "lightgreen"];

        function log(message) {
            if (DEBUG) {
                console.log(message);
            }
        }

        // 含两端
        function randInt(min, max) {
            return min + Math.floor(Math.random() * (max - min + 1));
        }

        function randomDigit() {
            return String(randInt(0, 9));
        }

        function resolveDifficulty(candidate) {
            const own = candidate.difficulty || {};
            const merged = Object.assign({}, DEFAULT_DIFFICULTY, own);
            merged.adaptive = Object.assign({}, DEFAULT_DIFFICULTY.adaptive, own.adaptive || {});
            return merged;
        }

        function readPassword(candidate) {
            const from = candidate.piStart - 1;
            if (from < 0 || candidate.length < 2 || from + candidate.length > PI.length) {
                return null;
            }
            return PI.substring(from, from + candidate.length).split('');
        }

        // 生成操作序列。动作就是操作者要做的事：INPUT 是输入一位，BACKSPACE 是按一次退格。
        //
        // 唯一的硬约束来自 iOS：密码框输满就自动提交，所以过程中字段最多只能有 length - 1 位，
        // 最后一步必然是输入真密码的最后一位。这一位的泄露无法靠序列消除，只能靠算术题打断。
        function buildOps(digits, diff) {
            const maxLen = digits.length - 1;
            const ops = [];
            const field = [];
            let retreats = 0;
            let clears = 0;
            const plannedClears = randInt(diff.minClears, diff.maxClears);

            // 权重偏向浅层：深度 1 权重最大，降低全清后重爬成本。
            function pickClearDepth() {
                let total = 0;
                for (let d = 1; d <= maxLen; d++) {
                    // 平方权重，比线性更偏向浅层
                    total += (maxLen - d + 1) * (maxLen - d + 1);
                }
                let roll = Math.random() * total;
                for (let d = 1; d <= maxLen; d++) {
                    roll -= (maxLen - d + 1) * (maxLen - d + 1);
                    if (roll <= 0) {
                        return d;
                    }
                }
                return 1;
            }

            const clearAtDepth = plannedClears > 0 ? pickClearDepth() : 0;

            function input(digit, isReal) {
                ops.push({ type: 'INPUT', digit: digit, real: isReal === true });
                field.push(digit);
            }

            function backspace() {
                ops.push({ type: 'BACKSPACE' });
                field.pop();
            }

            function hasBudget() {
                return ops.length + maxLen + 4 <= diff.maxOps;
            }

            // 在当前深度之上输入几位垃圾再删回来，字段恢复原样。
            // 真前缀之上放不下噪音时（已经到 maxLen）返回 false。
            function churn() {
                const room = maxLen - field.length;
                if (room <= 0) {
                    return false;
                }
                const count = room > 1 && Math.random() < diff.churnTwoDigitProbability ? 2 : 1;
                for (let i = 0; i < count; i++) {
                    input(randomDigit(), false);
                }
                for (let i = 0; i < count; i++) {
                    backspace();
                }
                return true;
            }

            // 预定全清：删回空。全清兼任一次回撤。
            // 之后紧接着 churn，所以「全清之后紧接着就是真密码」这个推断不成立。
            function clearAll() {
                while (field.length > 0) {
                    backspace();
                }
                ops[ops.length - 1].fullClear = true;
                clears++;
                retreats++;
                churn();
            }

            // 浅层回撤：删掉已经敲对的若干位，但至少留 1 位，避免额外全清破坏「恰好一次全清」。
            function retreat() {
                if (field.length <= 1) {
                    return false;
                }
                const deep = Math.random() < diff.deepRetreatProbability;
                const maxBack = field.length - 1;
                const back = deep ? randInt(1, maxBack) : 1;
                for (let i = 0; i < back; i++) {
                    backspace();
                }
                churn();
                retreats++;
                return true;
            }

            // 真攀：逐位敲对。非空字段上按 separatorProbability 插入噪音。
            // 真前缀首次到达 clearAtDepth 时执行预定全清，然后继续往上爬。
            // 空字段上的 churn 省掉：删到空之后 clearAll 已经 churn 过一轮垃圾。
            let guard = 0;
            while (guard++ < 2000) {
                if (field.length === maxLen) {
                    const needMore = retreats < diff.minRetreats;
                    const wantMore = hasBudget() && Math.random() < diff.retreatProbability;
                    if ((needMore || wantMore) && retreat()) {
                        continue;
                    }
                    break;
                }
                if (field.length > 0 && Math.random() < diff.separatorProbability) {
                    churn();
                }
                input(digits[field.length], true);

                if (clears < plannedClears && field.length === clearAtDepth) {
                    clearAll();
                    continue;
                }

                // 预定全清兼任 minRetreats；额外浅层回撤只在全清之后、按概率触发
                if (clears >= plannedClears && field.length < maxLen && hasBudget() &&
                    Math.random() < diff.retreatProbability) {
                    retreat();
                }
            }

            // 收尾：输入最后一位，输完即提交，这一步无法回撤。
            input(digits[maxLen], true);
            return ops;
        }

        // 算术题的落点。calcBefore[i] 表示第 i 步操作之前要先做几道题。
        function planCalcs(ops, diff) {
            const calcBefore = [];
            for (let i = 0; i < ops.length; i++) {
                calcBefore.push(0);
            }

            const realIdx = [];
            for (let i = 0; i < ops.length; i++) {
                if (ops[i].real) {
                    realIdx.push(i);
                }
            }

            let total = 0;

            // 真数字间隙按概率放题；落点在间隙内随机取，避免「题目总是紧跟真数字」。
            for (let k = 1; k < realIdx.length; k++) {
                if (total >= diff.maxCalcCount) {
                    break;
                }
                if (Math.random() < diff.gapCalcProbability) {
                    calcBefore[randInt(realIdx[k - 1] + 1, realIdx[k])] += 1;
                    total++;
                }
            }

            // 最后一位之前插不进任何按键噪音，只能出题来补偿。
            const last = ops.length - 1;
            const needFinal = Math.max(0, diff.finalGapCalcCount - calcBefore[last]);
            if (needFinal > 0 && total + needFinal <= diff.maxCalcCount) {
                calcBefore[last] += needFinal;
                total += needFinal;
            } else if (needFinal > 0 && calcBefore[last] < diff.finalGapCalcCount) {
                // 即使会略超 maxCalcCount，最后一位的打断也优先保证至少 1 题
                const add = Math.min(needFinal, Math.max(1, diff.finalGapCalcCount) - calcBefore[last]);
                calcBefore[last] += add;
                total += add;
            }

            // 诱饵题：让出题位置和真数字彻底脱钩。
            for (let i = 0; i < ops.length && total < diff.maxCalcCount; i++) {
                if (Math.random() < diff.extraCalcProbability) {
                    calcBefore[i] += 1;
                    total++;
                }
            }

            while (total < diff.minCalcCount) {
                calcBefore[randInt(0, ops.length - 1)] += 1;
                total++;
            }

            return calcBefore;
        }

        // 重放整个序列，确认它真的能把密码输进去，而且中途不会被提前提交。
        function verify(ops, digits, diff) {
            const maxLen = digits.length - 1;
            const field = [];
            let clears = 0;
            for (let i = 0; i < ops.length; i++) {
                const op = ops[i];
                if (op.type === 'INPUT') {
                    field.push(op.digit);
                } else if (field.length === 0) {
                    return '第 ' + i + ' 步对空字段退格';
                } else {
                    field.pop();
                }
                if (op.fullClear) {
                    clears++;
                }
                if (i < ops.length - 1 && field.length > maxLen) {
                    return '第 ' + i + ' 步长度超过 ' + maxLen + ' 位，会被提前提交';
                }
            }
            if (field.join('') !== digits.join('')) {
                return '终态与密码不一致';
            }
            if (diff) {
                if (clears < diff.minClears || clears > diff.maxClears) {
                    return '全清次数 ' + clears + ' 不在 [' + diff.minClears + ', ' + diff.maxClears + ']';
                }
            }
            // 最后两步物理上无法分开，其余位置不该出现连续的正确数字
            // （separatorProbability < 1 时可能偶发，由 buildSequence 重试消化）
            for (let i = 1; i < ops.length - 1; i++) {
                if (ops[i].real && ops[i - 1].real) {
                    return '第 ' + i + ' 步出现连续的正确数字';
                }
            }
            return null;
        }

        function buildSequence(digits, diff) {
            for (let attempt = 0; attempt < 20; attempt++) {
                const ops = buildOps(digits, diff);
                const problem = verify(ops, digits, diff);
                if (problem === null) {
                    return { ops: ops, calcBefore: planCalcs(ops, diff) };
                }
                log('序列自检失败，重新生成：' + problem);
            }
            return null;
        }

        function makeProblem(diff, lastCostSeconds) {
            const adaptive = diff.adaptive;
            let bonus = 0;
            if (lastCostSeconds > 0) {
                // 从严到宽判断，否则 fastBonus 这一档永远进不来
                if (lastCostSeconds < adaptive.fastSeconds) {
                    bonus = adaptive.fastBonus;
                } else if (lastCostSeconds <= adaptive.mediumSeconds) {
                    bonus = adaptive.mediumBonus;
                }
            }

            const terms = Math.max(2, diff.terms + bonus);
            const width = Math.max(1, diff.operandDigits);
            const min = width === 1 ? 1 : Math.pow(10, width - 1);
            const max = Math.pow(10, width) - 1;

            const values = [];
            let sum = 0;
            for (let i = 0; i < terms; i++) {
                let chosen = null;
                for (let attempt = 0; attempt < 50; attempt++) {
                    let value = randInt(min, max);
                    // 首项恒为正：负号只作为项之间的减号出现，表达式不会以负号开头
                    if (i > 0 && diff.allowNegativeTerms && Math.random() < 0.5) {
                        value = -value;
                    }
                    if (!diff.allowNegativeIntermediate && sum + value < 0) {
                        continue;
                    }
                    chosen = value;
                    break;
                }
                if (chosen === null) {
                    chosen = randInt(min, max);   // sum 非负时正项一定安全
                }
                values.push(chosen);
                sum += chosen;
            }

            let exp = String(values[0]);
            for (let i = 1; i < values.length; i++) {
                // 负项直接拼减号，不写成 11+(-11)
                exp += values[i] < 0 ? '-' + (-values[i]) : '+' + values[i];
            }
            return { exp: exp + '=', result: sum };
        }

        const display = document.getElementById('display');
        const chooser = document.getElementById('chooser');
        const nextBtn = document.getElementById('next_btn');

        const state = {
            sequence: null,
            difficulty: null,
            idx: 0,
            lastCostSeconds: 0
        };

        function askCalc() {
            for (;;) {
                const problem = makeProblem(state.difficulty, state.lastCostSeconds);
                for (;;) {
                    const startedAt = Date.now();
                    const raw = window.prompt(problem.exp);
                    // 取消或没填：重问同一题，不算答错。题目本身不可跳过。
                    if (raw === null || raw.trim() === '') {
                        continue;
                    }
                    const answer = Number.parseInt(raw, 10);
                    if (!Number.isFinite(answer)) {
                        continue;
                    }
                    if (answer === problem.result) {
                        state.lastCostSeconds = (Date.now() - startedAt) / 1000;
                        log('本题耗时 ' + state.lastCostSeconds + ' 秒');
                        return;
                    }
                    window.alert('回答错误，正确答案是：' + problem.exp + problem.result);
                    break;   // 换一道新题
                }
            }
        }

        function paint(text, step) {
            display.textContent = text;
            display.style.color = COLORS[step % COLORS.length];
            display.style.backgroundColor = BG_COLORS[step % BG_COLORS.length];
        }

        function showNextStep() {
            const sequence = state.sequence;
            if (sequence === null) {
                return;
            }
            if (state.idx >= sequence.ops.length) {
                display.textContent = '完成，密码已经全部输入！';
                nextBtn.textContent = '😎';
                return;
            }

            const rounds = sequence.calcBefore[state.idx];
            for (let i = 0; i < rounds; i++) {
                paint('算数时间😍', state.idx);
                askCalc();
            }

            const op = sequence.ops[state.idx];
            paint(op.type === 'INPUT' ? '请输入：' + op.digit : '请按一次退格，删除一个字符。', state.idx);
            state.idx++;
        }

        function start(candidate) {
            const digits = readPassword(candidate);
            if (digits === null) {
                display.textContent = '配置有误：' + candidate.name + ' 的 π 偏移量超出范围';
                return;
            }
            const difficulty = resolveDifficulty(candidate);
            const sequence = buildSequence(digits, difficulty);
            if (sequence === null) {
                display.textContent = '序列生成失败，请刷新重试';
                return;
            }

            state.sequence = sequence;
            state.difficulty = difficulty;
            state.idx = 0;
            state.lastCostSeconds = 0;
            log('共 ' + sequence.ops.length + ' 步');

            chooser.style.display = 'none';
            nextBtn.style.display = '';
            nextBtn.textContent = '我已输入，请显示下一个';
            showNextStep();
        }

        function renderChooser() {
            if (CANDIDATES.length === 0) {
                display.textContent = '还没有配置任何密码';
                nextBtn.style.display = 'none';
                return;
            }
            const single = CANDIDATES.length === 1;
            CANDIDATES.forEach(function (candidate) {
                const button = document.createElement('div');
                button.className = 'btn';
                button.textContent = single ? '开始输入密码' : candidate.name;
                button.addEventListener('click', function () {
                    start(candidate);
                });
                chooser.appendChild(button);
            });
        }

        nextBtn.style.display = 'none';
        nextBtn.addEventListener('click', showNextStep);
        renderChooser();

        if (DEBUG) {
            window.screenTimeInternals = {
                CANDIDATES: CANDIDATES,
                resolveDifficulty: resolveDifficulty,
                readPassword: readPassword,
                buildOps: buildOps,
                planCalcs: planCalcs,
                verify: verify,
                buildSequence: buildSequence,
                makeProblem: makeProblem
            };
        }
    })();
</script>
</body>
</html>
